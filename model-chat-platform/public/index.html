<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Hub · 模型对话平台</title><link rel="stylesheet" href="/styles.css"></head><body><div class="layout"><aside><div class="brand"><span class="logo">M</span><div><b>Model Hub</b><small>团队模型工作台</small></div></div><button class="new" id="newChat">＋ 新建对话</button><div class="label">最近对话</div><div id="chatList"></div><div class="sideFoot">API Key 仅保存在当前浏览器<br>不会写入服务端</div></aside><main><header><div><div class="eyebrow">WORKSPACE</div><h1 id="title">新对话</h1></div><div><span class="connection" id="connection">未连接</span></div></header><section class="content"><div class="messages" id="messages"><div class="welcome"><div class="welcomeIcon">✦</div><h2>连接你的模型，开始工作</h2><p>在右侧填写接口信息。支持 OpenAI 兼容的 Chat Completions 网关。</p><button id="welcomeAction">配置模型 →</button></div></div><form class="composer" id="form"><input id="file" type="file" accept="image/*,.txt,.md,.json,.csv,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip" multiple hidden><input id="folder" type="file" webkitdirectory directory multiple hidden><div class="attachActions"><button class="attach" type="button" id="chooseFile" title="选择文件">📎</button><button class="attach" type="button" id="chooseFolder" title="选择文件夹">▣</button></div><div class="composerBody"><div id="attachmentStatus" class="fileChip"></div><textarea id="input" rows="1" placeholder="输入消息…  Enter 发送，Shift + Enter 换行"></textarea></div><button type="submit" id="send">发送</button></form></section></main><aside class="settings"><div class="settingsHead"><h2>连接设置</h2><span class="secure">● 本地保存</span></div><label>接口地址<input id="baseUrl" placeholder="https://api.openai.com/v1"></label><div class="tip">支持以 /v1 结尾，平台会自动补全接口路径</div><label>API Key<input id="apiKey" type="password" placeholder="sk-..."></label><label>选择模型<select id="model"><option value="gpt-6-astra">6 Astra</option><option value="gpt-5.6-sol">5.6 Sol</option><option value="gpt-5.6-terra">5.6 Terra</option><option value="gpt-5.6-luna">5.6 Luna</option></select></label><input id="customModel" class="customModel" hidden placeholder="输入模型名称"><details><summary>高级设置（一般无需修改）</summary><div class="row"><label>回答随机性<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"><small>越高越有创意，越低越稳定</small></label><label>回答长度<input id="maxTokens" type="number" min="1" max="32000" value="2048"><small>限制一次回答的最长字数</small></label></div></details><button class="test" id="test">测试连接</button><div id="notice" class="notice"></div></aside></div><script src="/app.js"></script></body></html>
