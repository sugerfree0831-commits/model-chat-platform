<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Model Hub · 模型对话平台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="logo">M</span><div><b>Model Hub</b><small>团队模型工作台</small></div></div>
      <button class="new" id="newChat">＋ 新建对话</button>
      <div class="label">最近对话</div>
      <div id="chatList"></div>
      <div class="sideFoot">API Key 仅保存在当前浏览器<br>不会写入服务端</div>
    </aside>
    <main>
      <header><div><div class="eyebrow">WORKSPACE</div><h1 id="title">新对话</h1></div><div class="workspaceStatus"><span class="modeBadge" id="modeBadge">AI 品牌内容搭档</span><span class="connection" id="connection">未连接</span></div></header>
      <section class="content">
        <div class="messages" id="messages"><div class="welcome"><div class="welcomeIcon">✦</div><h2>连接你的模型，开始工作</h2><p>在右侧填写接口信息。支持 OpenAI 兼容的 Chat Completions 网关。</p><button id="welcomeAction">配置模型 →</button></div></div>
        <div class="composerWrap">
          <form class="composer" id="form">
            <input id="file" type="file" multiple hidden>
            <div id="attachmentStatus" class="attachmentTray" aria-live="polite"></div>
            <textarea id="input" rows="1" aria-label="消息内容" placeholder="输入消息，或粘贴内容…"></textarea>
            <div class="composerBar">
              <div class="attachActions">
                <button class="iconButton" type="button" id="chooseFile" title="添加文件" aria-label="添加文件">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.6l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg>
                </button>
                <span class="formatHint" title="图片、Markdown、PDF、Word、PPT、Excel、CSV、JSON、代码与压缩包">支持图片、Markdown、PDF、Office 等</span>
              </div>
              <div class="sendActions">
                <span class="keyHint">Enter 发送 · Shift + Enter 换行</span>
                <button type="submit" id="send"><span>发送</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button>
              </div>
            </div>
            <div class="dropHint" aria-hidden="true">松开即可添加文件</div>
          </form>
        </div>
      </section>
    </main>
    <aside class="settings"><div class="settingsHead"><h2>连接设置</h2><span class="secure">● 本地保存</span></div><label>接口地址<input id="baseUrl" placeholder="https://api.openai.com/v1"></label><div class="tip">支持以 /v1 结尾，平台会自动补全接口路径</div><label>API Key<input id="apiKey" type="password" placeholder="sk-..."></label><label>选择模型<select id="model"><option value="gpt-6-astra">6 Astra</option><option value="gpt-5.6-sol">5.6 Sol</option><option value="gpt-5.6-terra">5.6 Terra</option><option value="gpt-5.6-luna">5.6 Luna</option></select></label><input id="customModel" class="customModel" hidden placeholder="输入模型名称"><label>工作模式<select id="mode"><option value="brand-content">AI 品牌内容搭档</option><option value="general">通用对话</option></select></label><div class="modeNote" id="modeNote">自动应用你的内容判断标准、品牌知识、渠道规则与合规边界</div><details><summary>高级设置（一般无需修改）</summary><div class="row"><label>回答随机性<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"><small>越高越有创意，越低越稳定</small></label><label>回答长度<input id="maxTokens" type="number" min="1" max="32000" value="2048"><small>限制一次回答的最长字数</small></label></div></details><button class="test" id="test">测试连接</button><div id="notice" class="notice"></div></aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
